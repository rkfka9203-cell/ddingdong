name: Release

# v* 태그를 올리면 Windows에서 exe를 빌드해 GitHub Release에 첨부한다.
# 앱의 자동 업데이트는 이 릴리스의 Ddingdong.exe(와 GitHub가 계산한 SHA-256)를 사용한다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches APP_VERSION
        shell: python
        run: |
          import os, re, sys
          src = open("Ddingdong.pyw", encoding="utf-8").read()
          ver = re.search(r'APP_VERSION = "([^"]+)"', src).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if "v" + ver != tag:
              sys.exit("Tag %s does not match APP_VERSION v%s" % (tag, ver))
          print("OK", tag)

      - name: Build exe
        run: |
          python -m pip install pyinstaller
          python build_exe.py

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/Ddingdong.exe --title "$GITHUB_REF_NAME" --generate-notes
